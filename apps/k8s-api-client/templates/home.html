<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubernetes API Client</title>
  <style>
    body {
      margin: 0;
      font-family: "Iosevka Aile", "IBM Plex Sans", sans-serif;
      background: linear-gradient(160deg, #f8fafc, #e7ecef);
      color: #102a43;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    article {
      max-width: 720px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d9e2ec;
      border-radius: 28px;
      padding: 2rem;
      box-shadow: 0 24px 56px rgba(15, 23, 42, 0.08);
    }
    a {
      color: #0f766e;
      font-weight: 700;
      text-decoration: none;
    }
    code {
      background: #f0f4f8;
      padding: 0.12rem 0.35rem;
      border-radius: 0.35rem;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Kubernetes API Client</h1>
      <p>This starter app calls the Kubernetes API with the pod's service account and renders pod data as HTML.</p>
      <p>Open <a href="/pods">/pods</a> to list pods in the default namespace, or use <code>/pods?namespace=kube-system</code>.</p>
    </article>
  </main>
</body>
</html>
